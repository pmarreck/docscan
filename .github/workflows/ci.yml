name: CI

on:
  push:
    branches: [yolo]
  pull_request:
    branches: [yolo]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix build

      - name: Unit tests
        run: nix flake check

      - name: CLI tests
        run: |
          mkdir -p zig-out/bin
          cp result/bin/docscan zig-out/bin/docscan
          nix develop .#ci -c bash tests/cli/test-cli

      - name: MCP tests
        run: nix develop .#ci -c bash tests/mcp/test-mcp

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: docscan-${{ matrix.os == 'macos-latest' && 'aarch64-macos' || 'x86_64-linux' }}
          path: result/bin/docscan
          retention-days: 30

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cross-compile Linux aarch64
        run: |
          mkdir -p dist/aarch64-linux-musl/bin
          nix develop .#ci -c zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseFast --color off -p dist/aarch64-linux-musl

      - name: Cross-compile Windows x86_64
        run: |
          mkdir -p dist/x86_64-windows/bin
          nix develop .#ci -c zig build -Dtarget=x86_64-windows -Doptimize=ReleaseFast --color off -p dist/x86_64-windows

      - name: Cross-compile Windows aarch64
        run: |
          mkdir -p dist/aarch64-windows/bin
          nix develop .#ci -c zig build -Dtarget=aarch64-windows -Doptimize=ReleaseFast --color off -p dist/aarch64-windows

      - name: Upload cross-compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: docscan-cross-compiled
          path: dist/
          retention-days: 30
